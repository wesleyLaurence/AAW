[workspace]
resolver = "3"
members = ["crates/*"]
# aaw-py is a Python extension module. The Python package builds it against its
# interpreter (see pyproject.toml), so plain cargo commands leave it out.
default-members = [
    "crates/aaw-model",
    "crates/aaw-dsp",
    "crates/aaw-engine",
    "crates/aaw-host",
    "crates/aaw-cli",
    "crates/aaw-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
aaw-model = { path = "crates/aaw-model" }
aaw-dsp = { path = "crates/aaw-dsp" }
aaw-engine = { path = "crates/aaw-engine" }
aaw-host = { path = "crates/aaw-host" }

[profile.test]
opt-level = 1
