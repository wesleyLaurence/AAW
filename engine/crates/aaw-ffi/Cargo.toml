[package]
name = "aaw-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The binding generator, built only when the app's bindings are generated.
bindgen = ["uniffi/cli"]

[dependencies]
aaw-model.workspace = true
aaw-dsp.workspace = true
aaw-engine.workspace = true
aaw-host.workspace = true
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2.19"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
uniffi = "0.32.2"

[dev-dependencies]
tempfile = "3.27.0"
