schema_version: 2
session:
  tempo: 128.0
  end_fade_ms: 50.0
samples:
  tone:
    path: tone.wav
    root_note: A3
  hit:
    path: hit.wav
tracks:
- {id: hats, type: midi, gain_db: -4.0, instrument: {sampler: {drum_rack: true, pads: {h: {sample: hit, pan: 0.3,
          transpose: 3.0, release_ms: 5.0, choke_group: hh}}, map: [{notes: 36, pad: h}]}}, clips: [{id: hats, at: 1,
      length_beats: 12, loop_beats: 4, notes: [{id: n1, pitch: 36, duration: 1/4, velocity: 90}, {id: n2, pitch: 36,
          at: 1/2, duration: 1/4, velocity: 90}, {id: n3, pitch: 36, at: 1, duration: 1/4, velocity: 90}, {id: n4,
          pitch: 36, at: 13/10, duration: 1/4, velocity: 38}, {id: n5, pitch: 36, at: 3/2, duration: 1/4, velocity: 90},
        {id: n6, pitch: 36, at: 2, duration: 1/4, velocity: 90}, {id: n7, pitch: 36, at: 23/10, duration: 1/4, velocity: 90},
        {id: n8, pitch: 36, at: 14/5, duration: 1/4, velocity: 90}, {id: n9, pitch: 36, at: 3, duration: 1/4, velocity: 114},
        {id: n10, pitch: 36, at: 7/2, duration: 1/4, velocity: 90}]}], effects: [{type: filter, mode: highpass,
      cutoff_hz: 300.0}], sends: [{to: room, gain_db: -8.0}, {to: echo, gain_db: -12.0, pre_fader: true}]}
- {id: bass, type: midi, pan: -0.4, instrument: {sampler: {drum_rack: true, pads: {t: {sample: tone, mode: gate,
          attack_ms: 2.0, release_ms: 30.0}}, map: [{notes: [43, 52], pad: t, pitched: true}]}}, clips: [{id: bass,
      length_beats: 16, loop_beats: 4, notes: [{id: n1, pitch: 48, duration: 1}, {id: n2, pitch: 52, at: 1/3, duration: 2/3},
        {id: n3, pitch: 43, at: 2, duration: 1.5}]}], effects: [{type: eq, id: tone, bands: [{shape: bell, freq_hz: 400.0,
          gain_db: -3.0}, {shape: high_shelf, freq_hz: 5000.0, gain_db: 2.0}]}, {type: compressor, threshold_db: -30.0,
      ratio: 8.0, attack_ms: 1.0, release_ms: 150.0, sidechain: hats}, {type: filter, id: sweep, mode: lowpass,
      cutoff_hz: 8000.0, slope_db_per_octave: 24}, {type: limiter, ceiling_db: -3.0, lookahead_ms: 1.5}], sends: [
    {to: room, gain_db: -10.0}], automation: [{param: effects.sweep.cutoff_hz, points: [{at: 2, value: 300.0}, {
          at: 6, value: 9000.0}]}, {param: gain_db, points: [{at: 0, value: -3.0}, {at: 8, value: -9.0, curve: hold},
        {at: 12, value: -2.0}]}, {param: sends.room.gain_db, points: [{at: 4, value: -30.0}, {at: 4, value: -6.0}]}]}
- {id: layer, type: midi, instrument: {sampler: {drum_rack: true, pads: {t: {sample: tone, reverse: true, mono: true}},
      map: [{notes: [43, 52], pad: t, pitched: true}]}}, clips: [{id: bass-2, at: 4, length_beats: 8, loop_beats: 4,
      notes: [{id: n1, pitch: 48, duration: 1}, {id: n2, pitch: 52, at: 1/3, duration: 2/3}, {id: n3, pitch: 43,
          at: 2, duration: 1.5}]}], effects: [{type: compressor, threshold_db: -24.0, sidechain: bass}]}
returns:
- id: room
  effects:
  - {type: reverb, decay_seconds: 0.6, predelay_ms: 5.0}
  - {type: compressor, threshold_db: -30.0, sidechain: hats}
  automation:
  - param: pan
    points:
    - {at: 0, value: -0.5}
    - {at: 16, value: 0.5}
- id: echo
  gain_db: -3.0
  effects:
  - {type: delay, time_beats: 3/4, feedback_percent: 40.0, highcut_hz: 4000.0, ping_pong: true}
master:
  effects:
  - {type: limiter}
  automation:
  - param: gain_db
    points:
    - {at: 14, value: -6.0}
    - {at: 16, value: -20.0}
