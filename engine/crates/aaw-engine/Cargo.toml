[package]
name = "aaw-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aaw-model.workspace = true
aaw-dsp.workspace = true
num-bigint = "0.4"
num-traits = "0.2.19"
indexmap = "2.14.2"
sha2 = "0.11.0"
num-rational = { version = "0.4", features = ["num-bigint"] }
cpal = "0.18.2"
assert_no_alloc = "1.1.2"
tempfile = "3.27.0"
rtrb = "0.4.0"
signalsmith-stretch = "=0.1.3"
# Real-time devices of the person's own: WebAssembly compiled by Cranelift.
# No signal handlers, so it sits quietly in the app and in Python.
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
realfft = "3.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
# The listener for the default device changing, which cpal keeps to itself.
objc2-core-audio = "0.3.2"
objc2-core-foundation = "0.3.2"

[dev-dependencies]
assert_no_alloc = "1.1.2"
tempfile = "3.27.0"
# Test devices written as WebAssembly text.
wat = "1"
