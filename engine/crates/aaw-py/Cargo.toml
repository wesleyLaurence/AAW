[package]
name = "aaw-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aaw_py"
crate-type = ["cdylib"]

[dependencies]
aaw-model.workspace = true
num-bigint = "0.4"
num-rational = { version = "0.4.2", features = ["num-bigint"] }
num-traits = "0.2.19"
pyo3 = { version = "0.29.3", features = ["abi3-py312", "num-bigint"] }
