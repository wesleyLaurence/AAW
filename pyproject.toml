[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-daw"
version = "0.1.0"
description = "Offline sample workstation for agents"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "soundfile>=0.13,<1",
    "PyYAML>=6,<7",
    "pydantic>=2.10,<3",
    "pyloudnorm>=0.1.1,<0.2",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
daw = "agent_daw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
