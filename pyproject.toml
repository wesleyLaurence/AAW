[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.12"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-daw"
version = "0.1.0"
description = "Sample library, sample analysis and perception for Agent DAW"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "soundfile>=0.13,<1",
    "pyloudnorm>=0.1.1,<0.2",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[project.scripts]
daw = "agent_daw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The words for a sample's measurements and the lines between them, which
# the Rust model reads from the same file for daw describe samples.
[tool.setuptools.package-data]
agent_daw = ["sample_words.json"]

# The song model is the Rust one: engine/crates/aaw-py builds into the package
# as agent_daw.aaw_py, for the interpreter the package is installed into.
[[tool.setuptools-rust.ext-modules]]
target = "agent_daw.aaw_py"
path = "engine/crates/aaw-py/Cargo.toml"
binding = "PyO3"
debug = false

# Rebuild the module when the Rust model or the meter changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "engine/Cargo.lock" },
    { file = "engine/crates/aaw-py/**" },
    { file = "engine/crates/aaw-model/**" },
    { file = "engine/crates/aaw-dsp/**" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
